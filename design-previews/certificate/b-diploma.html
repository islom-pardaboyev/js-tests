<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B Diploma</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}body{background:#ecebe4;display:grid;place-items:center;min-height:100vh;padding:32px;font-family:'Bricolage Grotesque',sans-serif;color:#14161a}
.c{position:relative;width:1040px;height:720px;background:#fdfcf8;border-radius:6px;padding:28px;box-shadow:0 30px 60px -30px rgba(20,22,26,.35)}
.frame{position:absolute;inset:28px;border:1.5px solid #14161a;border-radius:4px}.frame2{position:absolute;inset:36px;border:1px solid #d2cfc4;border-radius:2px}
.br{position:absolute;font:700 34px 'JetBrains Mono';color:#2347d6;background:#fdfcf8;padding:0 8px;line-height:1}
.in{position:absolute;inset:36px;display:grid;grid-template-rows:auto auto 1fr auto;justify-items:center;text-align:center;padding:34px 60px 30px}
.seal{width:92px;height:92px;position:relative}.seal svg.g{position:absolute;inset:0}.seal .m{position:absolute;inset:20px;color:#14161a}
.in h2{font:500 14px 'JetBrains Mono';letter-spacing:.26em;text-transform:uppercase;color:#5b6069;margin:16px 0 4px}
h1{font:800 88px/1.02 'Bricolage Grotesque';letter-spacing:-.04em;margin:6px 0 0}
.rule{width:420px;height:1px;background:#14161a;margin:18px 0 14px}
.sub{font-size:18px;color:#5b6069;max-width:520px;line-height:1.5}.sub b{color:#14161a;font-weight:600}
.med{display:flex;gap:44px;margin-top:26px}.med div{display:grid;justify-items:center;gap:8px}
.ring{width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--c) var(--p),#e7e4da 0);display:grid;place-items:center}
.ring span{width:66px;height:66px;border-radius:50%;background:#fdfcf8;display:grid;place-items:center;font:700 17px 'JetBrains Mono'}
.med code{font:500 12px 'JetBrains Mono';color:#5b6069;text-transform:uppercase;letter-spacing:.1em}
.bot{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;width:100%;gap:20px}
.bot .l{justify-self:start;text-align:left;font:400 12px/1.7 'JetBrains Mono';color:#5b6069}.bot .l b{display:block;color:#14161a;font:700 15px 'Bricolage Grotesque'}
.sk{width:96px;height:96px}.qr{width:84px;height:84px;justify-self:end;border:1px solid #d2cfc4;border-radius:6px;overflow:hidden}
</style></head><body>
<article class="c"><div class="frame"></div><div class="frame2"></div>
<span class="br" style="left:56px;top:19px">{</span><span class="br" style="right:56px;top:19px">}</span><span class="br" style="left:56px;bottom:19px">{</span><span class="br" style="right:56px;bottom:19px">}</span>
<div class="in">
 <div class="seal"><svg class="g" viewBox="-50 -50 100 100" id="gl"></svg><div class="m" id="mk"></div></div>
 <div><h2>Certificate of achievement</h2><h1>[Your Name]</h1><div class="rule" style="margin-inline:auto"></div><p class="sub">has passed the <b>JavaScript Assessment</b> above the 70% pass mark on 27 October 2026.</p></div>
 <div class="med">
  <div><div class="ring" style="--c:#17a58a;--p:90%"><span>9/10</span></div><code>easy</code></div>
  <div><div class="ring" style="--c:#c27a10;--p:80%"><span>8/10</span></div><code>medium</code></div>
  <div><div class="ring" style="--c:#2d5bff;--p:75%"><span>3/4</span></div><code>hard</code></div>
 </div>
 <div class="bot"><div class="l"><b>JSTests</b>JST-ABCD-EFGH-2345<br>Score 83%</div><div class="sk" id="sk"></div><div class="qr" id="qr"></div></div>
</div></article>
<script src="shared.js"></script><script>
skin(document.getElementById('sk'),10,false);qr(document.getElementById('qr'));document.getElementById('mk').innerHTML=MARK;
let g='';for(let k=0;k<3;k++){const R=46-k*3;let d='';for(let a=0;a<=360;a+=3){const t=a*Math.PI/180,r=R-3*Math.sin(t*(14+k*3));d+=(a?'L':'M')+(r*Math.cos(t)).toFixed(1)+' '+(r*Math.sin(t)).toFixed(1)}g+=`<path d="${d}Z" fill="none" stroke="#2347d6" stroke-width=".5" opacity="${.9-k*.25}"/>`}
g+='<circle r="47" fill="none" stroke="#14161a" stroke-width="1.2"/>';document.getElementById('gl').innerHTML=g;
</script></body></html>
