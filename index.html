<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#15150f" />

    <title>JSTests | Prove your JavaScript</title>
    <meta name="description" content="Prove your JavaScript. Predict code output, write functions in a live editor, and earn a certificate with a QR code that anyone can verify." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph / Twitter (pages update these at runtime; crawlers that do not run JS read these defaults) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JSTests" />
    <meta property="og:title" content="JSTests | Prove your JavaScript" />
    <meta property="og:description" content="Predict code output, write functions in a live editor, and earn a certificate with a QR code that anyone can verify." />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="JSTests: Prove your JavaScript, with a indigo night mark" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JSTests | Prove your JavaScript" />
    <meta name="twitter:description" content="Predict code output, write functions in a live editor, and earn a certificate with a QR code that anyone can verify." />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "JSTests",
        "url": "%VITE_SITE_URL%/",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any",
        "inLanguage": "en",
        "description": "A proctored JavaScript assessment with a live code editor and certificates that can be verified by QR code.",
        "image": "%VITE_SITE_URL%/og-image.png",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      try { var t = localStorage.getItem('jstests-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>JSTests needs JavaScript to run the exam. It is a JavaScript assessment, after all.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
